<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chibi Merge - Giải Đố Nối Hình</title>
<style>
  :root {
    --bg1: #ffd6e0;
    --bg2: #ffefd6;
    --bg3: #fff5f7;
    --primary: #ff6b9d;
    --primary-dark: #e04f80;
    --accent: #ffb347;
    --text: #5a3e4d;
    --card: rgba(255, 255, 255, 0.92);
    --shadow: 0 8px 24px rgba(255, 107, 157, 0.22);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: 'Segoe UI', 'Rounded Mplus 1c', system-ui, -apple-system, sans-serif;
    background: linear-gradient(145deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
    color: var(--text);
    overflow: hidden;
    display: flex; justify-content: center; align-items: center;
  }
  #app {
    width: 100%; max-width: 460px; height: 100%; max-height: 860px;
    display: flex; flex-direction: column;
    padding: 10px 14px 14px;
    position: relative;
  }

  /* Header & Controls */
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
  }
  .level-badge {
    background: linear-gradient(135deg, #ff7eb3, #ff758c);
    color: #fff; font-weight: 800; font-size: 15px;
    padding: 6px 14px; border-radius: 20px;
    box-shadow: 0 4px 10px rgba(255, 117, 140, 0.35);
    display: flex; align-items: center; gap: 6px;
  }
  .icon-btns { display: flex; gap: 6px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%; border: none;
    background: var(--card); color: var(--text);
    font-size: 17px; cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.12s, background 0.15s;
  }
  .icon-btn:active { transform: scale(0.9); }

  /* HUD */
  .hud {
    background: var(--card); border-radius: 20px;
    padding: 10px 14px; margin-bottom: 8px;
    box-shadow: var(--shadow);
  }
  .hud-row {
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px;
  }
  .stat-box {
    display: flex; flex-direction: column; align-items: center;
    background: #fff5f8; border-radius: 14px; padding: 5px 10px;
    min-width: 72px; border: 2px solid #ffe0eb;
  }
  .stat-label { font-size: 11px; font-weight: 700; color: #a87b8e; text-transform: uppercase; }
  .stat-val { font-size: 19px; font-weight: 900; color: var(--primary-dark); line-height: 1.1; }
  .stat-val.low { color: #e53935; animation: pulse 0.7s infinite; }

  .goal-box {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    background: #fff9eb; border-radius: 14px; padding: 5px 10px;
    border: 2px solid #ffe4b5; min-height: 46px;
  }
  .goal-icon { width: 34px; height: 34px; flex-shrink: 0; }
  .goal-text { font-size: 13px; font-weight: 800; color: #8c5a2b; line-height: 1.2; }

  /* Goal Progress Bar + Score Stars Row */
  .progress-wrap {
    margin-top: 8px;
    display: flex; align-items: center; gap: 10px;
  }
  .progress-col { flex: 1; }
  .progress-label-row {
    display: flex; justify-content: space-between;
    font-size: 11px; font-weight: 700; color: #9c6f82; margin-bottom: 3px;
  }
  .progress-bar-bg {
    width: 100%; height: 11px; background: #f3dce4;
    border-radius: 10px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%; border-radius: 10px;
    background: linear-gradient(90deg, #ff7eb3, #ffb347);
    transition: width 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .hud-stars {
    display: flex; align-items: center; gap: 3px;
    background: #fff8e6; border: 2px solid #ffe0a3;
    padding: 4px 8px; border-radius: 12px;
  }
  .star-marker {
    font-size: 17px; filter: grayscale(1) opacity(0.35);
    transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s;
    display: inline-block;
  }
  .star-marker.earned {
    filter: none; transform: scale(1.22);
  }

  /* Combo bar */
  .combo-bar-wrap {
    height: 24px; margin-bottom: 6px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 6px;
  }
  .combo-pill {
    background: linear-gradient(90deg, #ff6b9d, #ffb347);
    color: #fff; font-weight: 900; font-size: 12px;
    padding: 2px 10px; border-radius: 12px;
    visibility: hidden; opacity: 0; transform: scale(0.8);
    transition: opacity 0.18s, transform 0.18s;
  }
  .combo-pill.active { visibility: visible; opacity: 1; transform: scale(1); }
  .combo-timer-bg {
    flex: 1; height: 6px; background: rgba(255,255,255,0.65);
    border-radius: 4px; margin-left: 8px; overflow: hidden;
    visibility: hidden; opacity: 0; transition: opacity 0.18s;
  }
  .combo-timer-bg.active { visibility: visible; opacity: 1; }
  .combo-timer-fill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #ff6b9d, #ffbe0b);
    transition: width 0.1s linear;
  }

  /* Board */
  .board-container {
    flex: 1; display: flex; justify-content: center; align-items: center;
    position: relative; min-height: 0;
  }
  .board-frame {
    width: 100%; max-width: 410px; aspect-ratio: 1 / 1;
    background: rgba(255, 255, 255, 0.72);
    border-radius: 26px; padding: 10px;
    box-shadow: 0 12px 30px rgba(255, 107, 157, 0.25), inset 0 0 0 3px rgba(255,255,255,0.9);
    position: relative;
    touch-action: none;
  }
  .grid {
    width: 100%; height: 100%;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 8px;
    position: relative; z-index: 2;
  }
  #lineCanvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 3;
  }

  /* Tile */
  .tile {
    position: relative; border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.08), 0 6px 12px rgba(0,0,0,0.06);
    transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.16s;
    overflow: hidden;
  }
  .tile svg { width: 88%; height: 88%; pointer-events: none; }
  .tile.selected {
    transform: scale(1.1);
    box-shadow: 0 0 0 4px #ff6b9d, 0 8px 18px rgba(255, 107, 157, 0.45);
    animation: wiggle 0.35s ease-in-out infinite;
    z-index: 4;
  }
  .tile.falling { animation: dropIn 0.32s cubic-bezier(0.34, 1.45, 0.64, 1); }
  .tile.merged { animation: popMerge 0.36s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .tile.locked { filter: saturate(0.75); }

  /* Overlays on tile */
  .tile-overlay {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    border-radius: 18px;
  }
  .ice-2 {
    background: rgba(160, 230, 255, 0.58);
    box-shadow: inset 0 0 0 4px rgba(255,255,255,0.85), inset 0 0 14px rgba(100, 200, 255, 0.8);
  }
  .ice-1 {
    background: rgba(180, 238, 255, 0.35);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.7);
  }
  .lock-overlay {
    background: rgba(80, 60, 75, 0.32);
    box-shadow: inset 0 0 0 3px #8d7b88;
  }
  .badge-corner {
    position: absolute; top: 3px; right: 4px;
    font-size: 13px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
  }

  /* Evolution preview bar */
  .evo-bar {
    display: flex; justify-content: center; align-items: center; gap: 4px;
    margin-top: 10px; background: rgba(255,255,255,0.75);
    padding: 6px 10px; border-radius: 16px;
    box-shadow: 0 4px 12px rgba(255, 107, 157, 0.12);
  }
  .evo-item {
    width: 30px; height: 30px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.55; transition: transform 0.2s, opacity 0.2s;
  }
  .evo-item.active { opacity: 1; transform: scale(1.18); box-shadow: 0 2px 8px rgba(255,107,157,0.35); }
  .evo-arrow { font-size: 10px; color: #c49aa8; font-weight: 900; }

  /* FX Layer */
  #fxCanvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 50;
  }
  .float-score {
    position: fixed; pointer-events: none; z-index: 60;
    font-weight: 900; font-size: 21px; color: #ff477e;
    text-shadow: 0 2px 0 #fff, 0 4px 10px rgba(255,71,126,0.35);
    animation: floatUp 1.05s ease-out forwards;
    text-align: center; white-space: nowrap;
  }
  .float-sub {
    display: block; font-size: 12px; font-weight: 800; color: #e67e22;
    text-shadow: 0 1px 0 #fff;
  }
  .big-combo {
    position: fixed; left: 50%; top: 44%; transform: translate(-50%, -50%);
    pointer-events: none; z-index: 65;
    font-size: 34px; font-weight: 900;
    background: linear-gradient(180deg, #ff5e92, #ff9900);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 3px 0 #fff) drop-shadow(0 6px 14px rgba(255,94,146,0.4));
    animation: comboPop 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    white-space: nowrap;
  }

  /* Modals - Crisp, immediate visibility */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(58, 32, 48, 0.62);
    z-index: 120;
    display: none; justify-content: center; align-items: center; padding: 18px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    width: 100%; max-width: 390px; max-height: 86vh;
    background: #fff9fb; border-radius: 28px;
    padding: 20px; box-shadow: 0 18px 40px rgba(0,0,0,0.28);
    border: 4px solid #ffd6e0;
    display: flex; flex-direction: column; overflow: hidden;
    opacity: 1;
  }
  .modal h2 {
    margin: 0 0 10px; text-align: center; font-size: 22px;
    color: var(--primary-dark);
  }
  .modal-body { overflow-y: auto; padding-right: 4px; font-size: 14px; line-height: 1.5; }
  .btn-row { display: flex; gap: 10px; margin-top: 14px; justify-content: center; }
  .btn {
    border: none; border-radius: 16px; padding: 11px 20px;
    font-size: 15px; font-weight: 800; cursor: pointer;
    transition: transform 0.12s;
  }
  .btn:active { transform: scale(0.95); }
  .btn-primary {
    background: linear-gradient(135deg, #ff6b9d, #ff8fab);
    color: #fff; box-shadow: 0 5px 14px rgba(255,107,157,0.35);
  }
  .btn-secondary { background: #ffe4ec; color: var(--primary-dark); }

  /* Level Map Grid */
  .map-toast {
    min-height: 22px; margin-bottom: 6px;
    text-align: center; font-size: 13px; font-weight: 800;
    color: #d94862;
  }
  .map-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    padding: 6px 2px;
  }
  .map-btn {
    aspect-ratio: 1; border-radius: 18px; border: 3px solid #ffd6e0;
    background: #fff; display: flex; flex-direction: column;
    align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 4px 10px rgba(255,107,157,0.12);
    transition: transform 0.12s;
  }
  .map-btn:active { transform: scale(0.93); }
  .map-btn.unlocked { background: linear-gradient(145deg, #fff, #fff0f5); border-color: #ff8fab; color: var(--text); }
  .map-btn.current { background: linear-gradient(145deg, #ff7eb3, #ff758c); color: #fff; border-color: #fff; }
  .map-btn.locked-lv {
    background: #eee6ea; border-color: #d8cdd2; color: #9c8c94;
    cursor: pointer;
  }
  .map-btn.locked-lv .map-num { opacity: 0.65; }
  .map-btn.shake { animation: shakeBtn 0.36s ease-in-out; }
  .map-num { font-size: 18px; font-weight: 900; line-height: 1.1; }
  .map-stars { font-size: 11px; margin-top: 2px; letter-spacing: 1px; }

  .win-stars { text-align: center; font-size: 40px; margin: 6px 0 10px; letter-spacing: 6px; }
  .help-item {
    display: flex; align-items: center; gap: 10px;
    background: #fff; padding: 8px 10px; border-radius: 14px; margin-bottom: 8px;
    border: 1.5px solid #ffe4ec;
  }
  .help-icon { width: 38px; height: 38px; flex-shrink: 0; }

  @keyframes wiggle {
    0%, 100% { transform: scale(1.1) rotate(-3deg); }
    50% { transform: scale(1.1) rotate(3deg); }
  }
  @keyframes shakeBtn {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-5px); }
    40% { transform: translateX(5px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  @keyframes dropIn {
    0% { transform: translateY(-42px) scale(0.85); opacity: 0.3; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  @keyframes popMerge {
    0% { transform: scale(0.5); }
    60% { transform: scale(1.22); }
    100% { transform: scale(1); }
  }
  @keyframes floatUp {
    0% { transform: translate(-50%, 0) scale(0.85); opacity: 1; }
    100% { transform: translate(-50%, -68px) scale(1.1); opacity: 0; }
  }
  @keyframes comboPop {
    0% { transform: translate(-50%, -50%) scale(0.4); opacity: 0; }
    25% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    75% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -70%) scale(0.9); opacity: 0; }
  }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.14); } }
</style>
</head>
<body>
<canvas id="fxCanvas"></canvas>

<div id="app">
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="level-badge" id="levelBadge">🌸 Màn 1</div>
    <div class="icon-btns">
      <button class="icon-btn" id="btnMap" title="Bản đồ màn">🗺️</button>
      <button class="icon-btn" id="btnHelp" title="Hướng dẫn">❓</button>
      <button class="icon-btn" id="btnSound" title="Âm thanh">🔊</button>
      <button class="icon-btn" id="btnPause" title="Tạm dừng">⏸️</button>
      <button class="icon-btn" id="btnRestart" title="Chơi lại">🔄</button>
    </div>
  </div>

  <!-- HUD -->
  <div class="hud">
    <div class="hud-row">
      <div class="stat-box">
        <span class="stat-label">Điểm</span>
        <span class="stat-val" id="scoreVal">0</span>
      </div>
      <div class="goal-box">
        <div class="goal-icon" id="goalIcon"></div>
        <div class="goal-text" id="goalText">Mục tiêu</div>
      </div>
      <div class="stat-box">
        <span class="stat-label">Lượt</span>
        <span class="stat-val" id="movesVal">13</span>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-col">
        <div class="progress-label-row">
          <span>Tiến độ mục tiêu</span>
          <span id="progressPct">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
      <div class="hud-stars" title="Sao đạt được theo mốc điểm">
        <span class="star-marker" id="star1">⭐</span>
        <span class="star-marker" id="star2">⭐</span>
        <span class="star-marker" id="star3">⭐</span>
      </div>
    </div>
  </div>

  <!-- Combo -->
  <div class="combo-bar-wrap">
    <div class="combo-pill" id="comboPill">COMBO x1</div>
    <div class="combo-timer-bg" id="comboTimerBg">
      <div class="combo-timer-fill" id="comboTimerFill"></div>
    </div>
  </div>

  <!-- 5x5 Board -->
  <div class="board-container">
    <div class="board-frame" id="boardFrame">
      <div class="grid" id="grid"></div>
      <canvas id="lineCanvas"></canvas>
    </div>
  </div>

  <!-- Evolution Chain Bar -->
  <div class="evo-bar" id="evoBar"></div>
</div>

<!-- Modal: Level Map -->
<div class="modal-backdrop" id="mapModal">
  <div class="modal">
    <h2>🗺️ Bản Đồ 20 Màn Chơi</h2>
    <div class="map-toast" id="mapToast"></div>
    <div class="modal-body">
      <div class="map-grid" id="mapGrid"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeMapModal()">Đóng</button>
    </div>
  </div>
</div>

<!-- Modal: Help -->
<div class="modal-backdrop" id="helpModal">
  <div class="modal">
    <h2>🐾 Hướng Dẫn Cách Chơi</h2>
    <div class="modal-body" id="helpBody"></div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="closeModal('helpModal')">Đã Hiểu!</button>
    </div>
  </div>
</div>

<!-- Modal: Pause -->
<div class="modal-backdrop" id="pauseModal">
  <div class="modal">
    <h2>⏸️ Tạm Dừng</h2>
    <div class="modal-body" style="text-align:center;">
      <p>Nghỉ ngơi một chút rồi tiếp tục chinh phục các bé Chibi nhé!</p>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="togglePause()">Tiếp Tục</button>
      <button class="btn btn-secondary" onclick="closeModal('pauseModal'); startLevel(currentLevel);">Chơi Lại</button>
    </div>
  </div>
</div>

<!-- Modal: Result (Win / Lose) -->
<div class="modal-backdrop" id="resultModal">
  <div class="modal">
    <h2 id="resultTitle">🎉 Qua Màn!</h2>
    <div class="win-stars" id="resultStars">⭐⭐⭐</div>
    <div class="modal-body" style="text-align:center;">
      <p id="resultDesc" style="margin:4px 0 10px; font-weight:700;"></p>
    </div>
    <div class="btn-row" id="resultBtns"></div>
  </div>
</div>

<script>
/* =========================================
   1. CHIBI SVG CHARACTERS (8 LEVELS + SPECIALS)
   ========================================= */
const CHARS = [
  { id: 0, name: 'Trứng',     bg: '#FFF3D6', line: '#F2C97D', basePts: 40 },
  { id: 1, name: 'Gà con',    bg: '#FFE98A', line: '#F5B82E', basePts: 60 },
  { id: 2, name: 'Vịt con',   bg: '#D6F5FF', line: '#5EC2E6', basePts: 85 },
  { id: 3, name: 'Thỏ',       bg: '#FFD6EB', line: '#F285B9', basePts: 120 },
  { id: 4, name: 'Mèo',       bg: '#FFE0C2', line: '#F29D52', basePts: 165 },
  { id: 5, name: 'Cún',       bg: '#E6D6FF', line: '#A47CE6', basePts: 220 },
  { id: 6, name: 'Gấu',       bg: '#E8D0C0', line: '#B58463', basePts: 300 },
  { id: 7, name: 'Vua Sư Tử', bg: '#FFD180', line: '#FF8F00', basePts: 420 }
];

function getChibiSVG(level, special = null) {
  if (special === 'rainbow') {
    return `<svg viewBox="0 0 100 100">
      <defs>
        <linearGradient id="rb" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff6b9d"/>
          <stop offset="33%" stop-color="#ffd93d"/>
          <stop offset="66%" stop-color="#6bcb77"/>
          <stop offset="100%" stop-color="#4d96ff"/>
        </linearGradient>
      </defs>
      <circle cx="50" cy="52" r="38" fill="url(#rb)" stroke="#fff" stroke-width="5"/>
      <path d="M50 16 L56 32 L73 32 L59 42 L64 58 L50 48 L36 58 L41 42 L27 32 L44 32 Z" fill="#fff" opacity="0.9"/>
      <circle cx="38" cy="56" r="4.5" fill="#3a243b"/><circle cx="62" cy="56" r="4.5" fill="#3a243b"/>
      <circle cx="36.5" cy="54.5" r="1.5" fill="#fff"/><circle cx="60.5" cy="54.5" r="1.5" fill="#fff"/>
      <path d="M44 65 Q50 71 56 65" fill="none" stroke="#3a243b" stroke-width="3" stroke-linecap="round"/>
    </svg>`;
  }
  if (special === 'bomb') {
    return `<svg viewBox="0 0 100 100">
      <path d="M52 24 Q60 10 74 14" fill="none" stroke="#8d6e63" stroke-width="5" stroke-linecap="round"/>
      <circle cx="76" cy="14" r="7" fill="#ff5722"/>
      <circle cx="76" cy="14" r="3.5" fill="#ffeb3b"/>
      <rect x="42" y="22" width="16" height="9" rx="3" fill="#616161"/>
      <circle cx="50" cy="58" r="33" fill="#37474f" stroke="#263238" stroke-width="3"/>
      <ellipse cx="36" cy="44" rx="7" ry="4" transform="rotate(-30 36 44)" fill="#78909c" opacity="0.6"/>
      <circle cx="39" cy="58" r="4.5" fill="#fff"/><circle cx="61" cy="58" r="4.5" fill="#fff"/>
      <circle cx="40" cy="58" r="2.2" fill="#263238"/><circle cx="62" cy="58" r="2.2" fill="#263238"/>
      <ellipse cx="31" cy="65" rx="4.5" ry="2.8" fill="#ff7096" opacity="0.8"/>
      <ellipse cx="69" cy="65" rx="4.5" ry="2.8" fill="#ff7096" opacity="0.8"/>
      <path d="M44 68 Q50 74 56 68" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </svg>`;
  }

/* =========================================
   2. WEB AUDIO SYNTHESIZER
   ========================================= */
let audioCtx = null;
let soundOn = true;

function initAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, dur = 0.1, type = 'sine', vol = 0.14, slideTo = null) {
  if (!soundOn) return;
  initAudio();
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + dur);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}

const SFX = {
  select: (step) => playTone(380 + step * 55, 0.08, 'triangle', 0.13),
  locked: () => playTone(180, 0.12, 'sawtooth', 0.09, 130),
  merge: (combo) => {
    const base = 440 + Math.min(combo, 5) * 55;
    playTone(base, 0.12, 'sine', 0.16, base * 1.35);
    setTimeout(() => playTone(base * 1.5, 0.16, 'triangle', 0.14), 70);
  },
  bomb: () => {
    playTone(160, 0.32, 'sawtooth', 0.2, 42);
    setTimeout(() => playTone(100, 0.25, 'square', 0.12, 30), 60);
  },
  win: () => {
    [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => playTone(f, 0.22, 'triangle', 0.16), i * 110));
  },
  lose: () => {
    [392, 349, 311, 261].forEach((f, i) => setTimeout(() => playTone(f, 0.22, 'sine', 0.14), i * 130));
  }
};

function startLevel(lvNum) {
  currentLevel = lvNum;
  const cfg = LEVELS[lvNum - 1];
  score = 0;
  movesLeft = cfg.moves;
  goalCount = 0;
  combo = 0;
  comboTime = 0;
  isPaused = false;
  isGameOver = false;
  chain = [];
  chainType = null;

  updateComboUI();

  // Create 5x5 board
  board = [];
  for (let r = 0; r < SIZE; r++) {
    const row = [];
    for (let c = 0; c < SIZE; c++) {
      row.push(createTile(randLevel(cfg.maxSpawn)));
    }
    board.push(row);
  }

  // Place locks & ices randomly
  const coords = [];
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) coords.push([r, c]);
  shuffle(coords);
  let idx = 0;
  for (let i = 0; i < cfg.locks && idx < coords.length; i++, idx++) {
    const [r, c] = coords[idx];
    board[r][c].locked = true;
  }
  for (let i = 0; i < cfg.ices && idx < coords.length; i++, idx++) {
    const [r, c] = coords[idx];
    board[r][c].ice = 2;
  }

  renderBoard(true);
  updateHUD();
  resizeCanvases();
}

function createTile(level, special = null) {
  return { level, special, locked: false, ice: 0, anim: '' };
}

function randLevel(maxSpawn) {
  const r = Math.random();
  if (r < 0.50) return 0;
  if (r < 0.80) return Math.min(1, maxSpawn - 1);
  if (r < 0.94) return Math.min(2, maxSpawn - 1);
  return Math.floor(Math.random() * maxSpawn);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function renderBoard(initial = false) {
  gridEl.innerHTML = '';

      const t = board[r][c];
      const cell = document.createElement('div');

      cell.dataset.r = r;
      cell.dataset.c = c;

      if (t.special === 'rainbow') cell.style.background = 'linear-gradient(135deg,#ffe0f0,#e0f7fa)';
      else if (t.special === 'bomb') cell.style.background = '#cfd8dc';
      else cell.style.background = CHARS[t.level].bg;

      if (initial || t.anim === 'fall') cell.classList.add('falling');
      if (t.anim === 'merge') cell.classList.add('merged');
      if (t.locked) cell.classList.add('locked');

/* =========================================
   7. POINTER / DRAG INTERACTION
   ========================================= */
const boardFrame = document.getElementById('boardFrame');

boardFrame.addEventListener('pointerdown', (e) => {
  if (isPaused || isGameOver) return;
  initAudio();
  const cell = e.target.closest('.tile');
  if (!cell) return;
  const r = +cell.dataset.r, c = +cell.dataset.c;
  const tile = board[r][c];
  if (tile.locked) return;

  isDragging = true;
  chain = [{ r, c }];
  chainType = tile.special ? null : tile.level;
  SFX.select(0);
  updateSelectionUI();
});

window.addEventListener('pointermove', (e) => {
  if (!isDragging || isPaused || isGameOver) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  if (!el) return;
  const cell = el.closest('.tile');
  if (!cell) return;
  const r = +cell.dataset.r, c = +cell.dataset.c;

  // Backtrack
  if (chain.length >= 2) {
    const prev = chain[chain.length - 2];
    if (prev.r === r && prev.c === c) {
      chain.pop();
      recalcChainType();
      SFX.select(chain.length - 1);
      updateSelectionUI();
      return;
    }
  }

  if (chain.some(p => p.r === r && p.c === c)) return;

  const last = chain[chain.length - 1];
  if (Math.abs(last.r - r) > 1 || Math.abs(last.c - c) > 1) return;

  const tile = board[r][c];
  if (tile.locked) return;

  const canConnect = tile.special !== null || chainType === null || tile.level === chainType;
  if (!canConnect) return;

  if (chainType === null && !tile.special) chainType = tile.level;
  chain.push({ r, c });
  SFX.select(chain.length - 1);
  updateSelectionUI();
});

window.addEventListener('pointerup', finishDrag);
window.addEventListener('pointercancel', finishDrag);

function recalcChainType() {
  chainType = null;
  for (const p of chain) {
    const t = board[p.r][p.c];
    if (!t.special) { chainType = t.level; break; }
  }
}

function updateSelectionUI() {
  document.querySelectorAll('.tile.selected').forEach(el => el.classList.remove('selected'));
  chain.forEach(p => {
    const el = gridEl.children[p.r * SIZE + p.c];
    if (el) el.classList.add('selected');
  });
  drawChainLine();
}

function drawChainLine() {
  lineCtx.clearRect(0, 0, lineCanvas.width, lineCanvas.height);
  if (chain.length < 2) return;
  const rect = boardFrame.getBoundingClientRect();
  lineCtx.save();
  lineCtx.lineWidth = 10;
  lineCtx.lineCap = 'round';
  lineCtx.lineJoin = 'round';
  lineCtx.strokeStyle = chainType !== null ? CHARS[chainType].line : '#ff6b9d';
  lineCtx.globalAlpha = 0.78;
  lineCtx.beginPath();
  chain.forEach((p, i) => {
    const el = gridEl.children[p.r * SIZE + p.c];
    const er = el.getBoundingClientRect();
    const x = er.left - rect.left + er.width / 2;
    const y = er.top - rect.top + er.height / 2;
    if (i === 0) lineCtx.moveTo(x, y);
    else lineCtx.lineTo(x, y);
  });
  lineCtx.stroke();
  lineCtx.restore();
}

/* =========================================
   8. MERGE, TRANSPARENT SCORING, GRAVITY & WIN/LOSE
   ========================================= */
function finishDrag() {
  if (!isDragging) return;
  isDragging = false;
  lineCtx.clearRect(0, 0, lineCanvas.width, lineCanvas.height);
  document.querySelectorAll('.tile.selected').forEach(el => el.classList.remove('selected'));

  const hasBomb = chain.some(p => board[p.r][p.c].special === 'bomb');
  if (chain.length < 3 && !(hasBomb && chain.length >= 2)) {
    chain = [];
    return;
  }

  executeMerge();
}

function executeMerge() {
  const cfg = LEVELS[currentLevel - 1];
  const len = chain.length;
  const lastPos = chain[len - 1];

  // Combo: starts at x1 on first merge, +1 per consecutive merge within 5.5s (max x5)
  combo = comboTime > 0 ? Math.min(5, combo + 1) : 1;
  comboTime = COMBO_MAX_TIME;
  updateComboUI();

  // Evolution step: 3-4 -> +1, 5-6 -> +2, 7+ -> +3
  const baseLv = chainType !== null ? chainType : 0;
  const evoStep = len >= 7 ? 3 : (len >= 5 ? 2 : 1);
  const newLv = Math.min(CHARS.length - 1, baseLv + evoStep);

  // Check bombs in chain
  const bombs = chain.filter(p => board[p.r][p.c].special === 'bomb');
  const chainKeys = new Set(chain.map(p => `${p.r},${p.c}`));
  const toClear = new Set(chainKeys);

  if (bombs.length > 0) {
    SFX.bomb();
    bombs.forEach(b => {
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = b.r + dr, nc = b.c + dc;
          if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) {
            toClear.add(`${nr},${nc}`);
            if (board[nr][nc].locked) board[nr][nc].locked = false;
          }
        }
      }
    });
  } else {
    SFX.merge(combo);
  }

  // Unlock adjacent locked tiles
  chain.forEach(p => {
    [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr, dc]) => {
      const nr = p.r + dr, nc = p.c + dc;
      if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc].locked) {
        board[nr][nc].locked = false;
        spawnParticlesAtCell(nr, nc, 8, '#ffb347');
      }
    });
  });

  // Process cleared cells (Ice takes 2 hits)
  let bombExtraCleared = 0;
  toClear.forEach(key => {
    const [r, c] = key.split(',').map(Number);
    const t = board[r][c];
    if (r === lastPos.r && c === lastPos.c) return;

    if (t.ice > 1) {
      t.ice -= 1;
      spawnParticlesAtCell(r, c, 6, '#80d8ff');
    } else {
      if (t.ice === 1) {
        t.ice = 0;
        if (cfg.goal.type === 'ice') goalCount++;
        spawnParticlesAtCell(r, c, 10, '#80d8ff');
      }
      if (!chainKeys.has(key)) bombExtraCleared++;
      board[r][c] = null;
    }
  });

  // Target cell becomes evolved character (or special if chain >= 5)
  const targetTile = board[lastPos.r][lastPos.c];
  if (targetTile && targetTile.ice > 0) {
    targetTile.ice -= 1;
    if (targetTile.ice === 0 && cfg.goal.type === 'ice') goalCount++;
  }

  let spawnedSpecial = null;
  if (len >= 6) spawnedSpecial = 'bomb';
  else if (len === 5) spawnedSpecial = 'rainbow';

  const newTile = createTile(newLv, spawnedSpecial);
  newTile.anim = 'merge';
  if (targetTile && targetTile.ice > 0) newTile.ice = targetTile.ice;
  board[lastPos.r][lastPos.c] = newTile;

  // Goal: collect
  if (cfg.goal.type === 'collect' && !spawnedSpecial && newLv >= cfg.goal.level) {
    goalCount++;
  }

  // CONSISTENT & TRANSPARENT SCORING FORMULA
  const baseScore = CHARS[baseLv].basePts * len * combo;
  const longBonus = len >= 5 ? (len - 4) * 120 : 0;
  const bombBonus = bombExtraCleared * 40;
  const gained = baseScore + longBonus + bombBonus;

  score += gained;
  movesLeft--;

  // Transparent breakdown label
  const reasons = [];
  if (combo >= 2) reasons.push(`Combo x${combo}`);
  if (longBonus > 0) reasons.push(`Thưởng chuỗi ${len}! +${longBonus}`);
  if (bombBonus > 0) reasons.push(`Bom +${bombBonus}`);

  const targetEl = gridEl.children[lastPos.r * SIZE + lastPos.c];
  const tr = targetEl.getBoundingClientRect();
  spawnParticles(tr.left + tr.width / 2, tr.top + tr.height / 2, len >= 5 ? 24 : 14);
  showFloatingScore(tr.left + tr.width / 2, tr.top + tr.height / 2, `+${gained}`, reasons.join(' • '));

  if (len >= 5) {
    showBigCombo(`THƯỞNG CHUỖI ${len}! +${longBonus}`);
  } else if (combo >= 2) {
    showBigCombo(`COMBO x${combo}!`);
  }

  applyGravity(cfg.maxSpawn);
  renderBoard();
  updateHUD();
  checkEndState();
}

function applyGravity(maxSpawn) {
  for (let c = 0; c < SIZE; c++) {
    let writeR = SIZE - 1;
    for (let r = SIZE - 1; r >= 0; r--) {
      if (board[r][c] !== null) {
        if (writeR !== r) {
          board[writeR][c] = board[r][c];
          board[writeR][c].anim = 'fall';
          board[r][c] = null;
        }
        writeR--;
      }
    }
    for (let r = writeR; r >= 0; r--) {
      const nt = createTile(randLevel(maxSpawn));
      nt.anim = 'fall';
      board[r][c] = nt;
    }
  }
}

function checkEndState() {
  const cfg = LEVELS[currentLevel - 1];
  let won = false;
  if (cfg.goal.type === 'score' && score >= cfg.goal.target) won = true;
  if (cfg.goal.type === 'collect' && goalCount >= cfg.goal.target) won = true;
  if (cfg.goal.type === 'ice' && goalCount >= cfg.goal.target) won = true;

  if (won) {
    isGameOver = true;
    const moveBonus = movesLeft * 120;
    score += moveBonus;
    updateHUD();
    const earnedStars = score >= cfg.stars[2] ? 3 : (score >= cfg.stars[1] ? 2 : 1);
    const prevStars = progressData.stars[cfg.id] || 0;
    progressData.stars[cfg.id] = Math.max(prevStars, earnedStars);
    if (cfg.id >= progressData.unlocked && cfg.id < LEVELS.length) {
      progressData.unlocked = cfg.id + 1;
    }
    saveProgress();
    SFX.win();
    launchFireworks();
    setTimeout(() => showResult(true, earnedStars, moveBonus), 450);
  } else if (movesLeft <= 0) {
    isGameOver = true;
    SFX.lose();
    setTimeout(() => showResult(false, 0, 0), 350);
  }
}

/* =========================================
   9. PARTICLES, FIREWORKS & FLOATING TEXT
   ========================================= */
let particles = [];

function spawnParticlesAtCell(r, c, count, color = null) {
  const el = gridEl.children[r * SIZE + c];
  if (!el) return;
  const rect = el.getBoundingClientRect();
  spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, count, color);
}

function spawnParticles(x, y, count = 14, fixedColor = null) {
  const colors = ['#ff6b9d', '#ffb347', '#ffd93d', '#6bcb77', '#72c6e8', '#c77dff'];
  const shapes = ['heart', 'star', 'circle'];
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2.2 + Math.random() * 5.2;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1.8,
      size: 6 + Math.random() * 7,
      color: fixedColor || colors[Math.floor(Math.random() * colors.length)],
      shape: shapes[Math.floor(Math.random() * shapes.length)],
      life: 1,
      decay: 0.02 + Math.random() * 0.018
    });
  }
}

function launchFireworks() {
  for (let i = 0; i < 5; i++) {
    setTimeout(() => {
      const x = window.innerWidth * (0.2 + Math.random() * 0.6);
      const y = window.innerHeight * (0.2 + Math.random() * 0.4);
      spawnParticles(x, y, 28);
    }, i * 200);
  }
}

function showFloatingScore(x, y, mainText, subText = '') {
  const el = document.createElement('div');
  el.className = 'float-score';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.innerHTML = mainText + (subText ? `<span class="float-sub">${subText}</span>` : '');
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1080);
}

function showBigCombo(text) {
  const el = document.createElement('div');
  el.className = 'big-combo';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 920);
}

function drawHeart(ctx, x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.3);
  ctx.bezierCurveTo(x, y, x - s, y, x - s, y + s * 0.35);
  ctx.bezierCurveTo(x - s, y + s * 0.8, x, y + s * 1.1, x, y + s * 1.3);
  ctx.bezierCurveTo(x, y + s * 1.1, x + s, y + s * 0.8, x + s, y + s * 0.35);
  ctx.bezierCurveTo(x + s, y, x, y, x, y + s * 0.3);
  ctx.fill();
}

function drawStar(ctx, x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = (i * 4 * Math.PI) / 5 - Math.PI / 2;
    const px = x + Math.cos(a) * r;
    const py = y + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
}

function gameLoop(now) {
  const dt = now - lastFrameTime;
  lastFrameTime = now;

  // Combo countdown
  if (!isPaused && !isGameOver && comboTime > 0) {
    comboTime = Math.max(0, comboTime - dt);
    if (comboTime === 0) combo = 0;
    updateComboUI();
  }

  // Particles
  fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.14;
    p.life -= p.decay;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    fxCtx.save();
    fxCtx.globalAlpha = p.life;
    fxCtx.fillStyle = p.color;
    if (p.shape === 'heart') drawHeart(fxCtx, p.x, p.y - p.size * 0.5, p.size * 0.65);
    else if (p.shape === 'star') drawStar(fxCtx, p.x, p.y, p.size);
    else { fxCtx.beginPath(); fxCtx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI * 2); fxCtx.fill(); }
    fxCtx.restore();
  }
  requestAnimationFrame(gameLoop);
}

/* =========================================
   10. MODALS & UI BUTTONS
   ========================================= */
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function closeMapModal() {
  closeModal('mapModal');
  // Nếu màn hiện tại đã kết thúc (hết lượt / đã thắng), mở lại hộp thoại kết quả để không bị kẹt ở bàn cờ 0 lượt
  if (isGameOver) {
    openModal('resultModal');
  }
}

function showResult(won, stars, moveBonus = 0) {
  document.getElementById('resultTitle').textContent = won ? `🎉 Qua Màn ${currentLevel}!` : '😿 Hết Lượt Rồi!';
  document.getElementById('resultStars').textContent = won ? ('⭐'.repeat(stars) + '☆'.repeat(3 - stars)) : '💔';
  document.getElementById('resultDesc').textContent = won
    ? `Điểm tổng: ${score.toLocaleString('vi-VN')}${moveBonus > 0 ? ` (gồm +${moveBonus.toLocaleString('vi-VN')} thưởng lượt dư)` : ''}`
    : `Bạn đạt ${score.toLocaleString('vi-VN')} điểm nhưng chưa hoàn thành mục tiêu. Thử lại nhé!`;

  const btns = document.getElementById('resultBtns');
  btns.innerHTML = '';

  const retry = document.createElement('button');
  retry.className = 'btn ' + (won ? 'btn-secondary' : 'btn-primary');
  retry.textContent = 'Chơi Lại';
  retry.onclick = () => { closeModal('resultModal'); startLevel(currentLevel); };
  btns.appendChild(retry);

  if (won && currentLevel < LEVELS.length) {
    const next = document.createElement('button');
    next.className = 'btn btn-primary';
    next.textContent = 'Màn Tiếp Theo ➡️';
    next.onclick = () => { closeModal('resultModal'); startLevel(currentLevel + 1); };
    btns.appendChild(next);
  } else {
    const mapBtn = document.createElement('button');
    mapBtn.className = 'btn ' + (won ? 'btn-primary' : 'btn-secondary');
    mapBtn.textContent = 'Bản Đồ Màn';
    mapBtn.onclick = () => { closeModal('resultModal'); openMap(); };
    btns.appendChild(mapBtn);
  }
  openModal('resultModal');
}

let toastTimer = null;
function openMap() {
  const grid = document.getElementById('mapGrid');
  const toast = document.getElementById('mapToast');
  toast.textContent = '';
  grid.innerHTML = '';

  LEVELS.forEach(lv => {
    const unlocked = lv.id <= progressData.unlocked;
    const st = progressData.stars[lv.id] || 0;
    const btn = document.createElement('button');
    btn.className = 'map-btn ' + (lv.id === currentLevel ? 'current' : (unlocked ? 'unlocked' : 'locked-lv'));

    btn.innerHTML = `<div class="map-num">${lv.id}</div>
      <div class="map-stars">${unlocked ? ('⭐'.repeat(st) + '☆'.repeat(3 - st)) : '🔒'}</div>`;

    if (unlocked) {
      btn.onclick = () => { closeModal('mapModal'); startLevel(lv.id); };
    } else {
      btn.onclick = () => {
        SFX.locked();
        btn.classList.remove('shake');
        void btn.offsetWidth;
        btn.classList.add('shake');
        toast.textContent = `🔒 Hoàn thành màn ${lv.id - 1} để mở khóa màn này!`;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toast.textContent = ''; }, 2600);
      };
    }
    grid.appendChild(btn);
  });
  openModal('mapModal');
}

function openHelp() {
  document.getElementById('helpBody').innerHTML = `
    <div class="help-item">
      <div class="help-icon">${getChibiSVG(1)}</div>
      <div><b>Nối 3+ hình giống nhau</b> (ngang, dọc, chéo) để gộp thành bé Chibi cấp cao hơn. Điểm = Điểm cơ bản × Số ô × Combo.</div>
    </div>
    <div class="help-item">
      <div class="help-icon">${getChibiSVG(0, 'rainbow')}</div>
      <div><b>Ô Cầu Vồng (nối 5 ô):</b> Nối được với mọi nhân vật Chibi, kèm thưởng chuỗi dài!</div>
    </div>
    <div class="help-item">
      <div class="help-icon">${getChibiSVG(0, 'bomb')}</div>
      <div><b>Ô Bom (nối 6+ ô):</b> Khi nối vào chuỗi sẽ nổ tung vùng 3x3 xung quanh!</div>
    </div>
    <div class="help-item">
      <div class="help-icon" style="font-size:26px;text-align:center;">🔒❄️</div>
      <div><b>Ô Khóa:</b> Nối hình ngay kế bên để mở khóa.<br><b>Ô Băng:</b> Cần gộp 2 lần mới phá vỡ hoàn toàn.</div>
    </div>
  `;
  openModal('helpModal');
}

function togglePause() {
  if (isGameOver) return;
  isPaused = !isPaused;
  if (isPaused) openModal('pauseModal');
  else closeModal('pauseModal');
}

document.getElementById('btnMap').onclick = openMap;
document.getElementById('btnHelp').onclick = openHelp;
document.getElementById('btnPause').onclick = togglePause;
document.getElementById('btnRestart').onclick = () => startLevel(currentLevel);
document.getElementById('btnSound').onclick = (e) => {
  soundOn = !soundOn;
  e.target.textContent = soundOn ? '🔊' : '🔇';
};

function resizeCanvases() {
  const rect = boardFrame.getBoundingClientRect();
  lineCanvas.width = rect.width;
  lineCanvas.height = rect.height;
  fxCanvas.width = window.innerWidth;
  fxCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvases);

// Boot
buildEvoBar();
startLevel(currentLevel);
requestAnimationFrame(gameLoop);
</script>
